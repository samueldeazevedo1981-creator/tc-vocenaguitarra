<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101510">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Trucker Cap Você na Guitarra</title>
</head>
<body>
  <main>
    <header>
      <img src="./icon-192.png" alt="" width="64" height="64">
      <div><p>Trucker Cap Studio</p><h1>Você na Guitarra</h1></div>
    </header>
    <p>Isole a guitarra para tirar riffs de ouvido ou pratique com a base da sua música.</p>
    <section aria-label="Separar guitarra">
      <label for="file">Música em MP3</label>
      <input id="file" type="file" accept=".mp3,audio/mpeg">
      <div class="actions">
        <button id="separate" disabled>Separar guitarra</button>
        <button id="cancel" class="secondary" hidden>Cancelar</button>
      </div>
      <progress id="progress" max="1" hidden aria-label="Progresso"></progress>
      <p id="status" role="status">Escolha um MP3. O primeiro uso baixa o modelo de aproximadamente 38 MB.</p>
    </section>
    <section id="results" aria-label="Faixas para estudar" hidden>
      <label for="mode">Faixa de estudo</label>
      <select id="mode">
        <option value="guitar">Só guitarra</option>
        <option value="backing">Base sem guitarra</option>
      </select>
      <div class="actions">
        <button id="play">Ouvir</button>
        <button id="save" class="secondary">Baixar MP3</button>
      </div>
      <label for="seek">Posição <span id="position"></span></label>
      <input type="range" id="seek" min="0" max="1" value="0" step="0.01">
    </section>
    <footer><a href="./LICENSES.txt">Licenças</a></footer>
  </main>
  <script type="module" src="./estudo.js"></script>
</body>
</html>
